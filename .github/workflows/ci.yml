name: BridgeGuardian AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Linting, Static Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Run Ruff Code Linter
        run: |
          ruff check .

      - name: Execute Automated Test Suite
        run: |
          pytest backend/tests/unit backend/tests/integration backend/tests/test_api.py -v --cov=backend

  docker-build-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t bridgeguardian-backend:latest -f Dockerfile.backend .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bridgeguardian-backend:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
