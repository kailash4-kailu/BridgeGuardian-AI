<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Tech Dark Blue Gradient -->
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101E"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#030A14"/>
    </linearGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="fullShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2545"/>
      <stop offset="100%" stop-color="#050E1F"/>
    </linearGradient>
    <linearGradient id="fullBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070F3"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="fullGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="textGuardianGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Optional Dark Blue Tech Pattern Background -->
  <rect width="1200" height="400" rx="24" fill="url(#fullBgGrad)"/>

  <!-- Subtle Tech Grid Lines in Background -->
  <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.07"/>
  <path d="M 300 0 V 400 M 600 0 V 400 M 900 0 V 400" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.07"/>

  <!-- Background Bridge Silhouette Grid Wireframe (Optional Aesthetic Accent) -->
  <path d="M 0 360 Q 600 180 1200 360" fill="none" stroke="#0070F3" stroke-width="2" stroke-opacity="0.15"/>
  <path d="M 0 380 Q 600 240 1200 380" fill="none" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.1"/>

  <!-- LEFT: SHIELD LOGO ICON -->
  <g transform="translate(60, 30) scale(0.72)">
    <!-- Outer Shield Boundary -->
    <path d="M 256 44 
             C 380 44, 436 80, 436 180 
             C 436 320, 310 430, 256 468 
             C 202 430, 76 320, 76 180 
             C 76 80, 132 44, 256 44 Z" 
          fill="url(#fullShieldGrad)" 
          stroke="url(#fullBlueGrad)" 
          stroke-width="16" 
          stroke-linejoin="round"/>

    <!-- Inner Tech Circuit Network Lines -->
    <path d="M 120 180 H 392" stroke="#1E293B" stroke-width="6"/>
    <path d="M 160 120 V 280" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 6"/>
    <path d="M 352 120 V 280" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 6"/>

    <!-- Bridge Arch Truss (Upper Portion) -->
    <path d="M 110 180 Q 256 80 402 180" 
          fill="none" 
          stroke="url(#fullBlueGrad)" 
          stroke-width="14" 
          stroke-linecap="round"/>
          
    <path d="M 130 180 Q 256 104 382 180" 
          fill="none" 
          stroke="#00D2FF" 
          stroke-width="6" 
          stroke-opacity="0.8"/>

    <!-- Vertical Bridge Suspension Cables -->
    <line x1="160" y1="162" x2="160" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="200" y1="140" x2="200" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="256" y1="126" x2="256" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="312" y1="140" x2="312" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="352" y1="162" x2="352" y2="180" stroke="#00D2FF" stroke-width="6"/>

    <!-- Lower Circuit Nodes -->
    <path d="M 160 180 L 220 280 L 256 360 L 292 280 L 352 180" 
          fill="none" 
          stroke="url(#fullBlueGrad)" 
          stroke-width="6" 
          stroke-dasharray="12 8"/>

    <path d="M 256 180 V 420" 
          stroke="url(#fullBlueGrad)" 
          stroke-width="8"/>

    <!-- Circuit Nodes (Dots) -->
    <circle cx="160" cy="180" r="10" fill="#00D2FF"/>
    <circle cx="200" cy="180" r="8" fill="#0070F3"/>
    <circle cx="256" cy="180" r="12" fill="#00D2FF" filter="url(#fullGlow)"/>
    <circle cx="312" cy="180" r="8" fill="#0070F3"/>
    <circle cx="352" cy="180" r="10" fill="#00D2FF"/>

    <circle cx="220" cy="280" r="9" fill="#00D2FF"/>
    <circle cx="292" cy="280" r="9" fill="#00D2FF"/>
    <circle cx="256" cy="360" r="11" fill="#0070F3"/>
    <circle cx="256" cy="420" r="9" fill="#00D2FF"/>

    <!-- Green Structural Health Pulse Line -->
    <path d="M 90 240 
             L 170 240 
             L 190 210 
             L 210 270 
             L 235 175 
             L 265 295 
             L 285 225 
             L 305 250 
             L 320 240 
             L 422 240" 
          fill="none" 
          stroke="url(#fullGreenGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#fullGlow)"/>
  </g>

  <!-- RIGHT: BRAND TEXT "BridgeGuardian" -->
  <g transform="translate(420, 235)">
    <!-- "Bridge" text in Bold White -->
    <text x="0" y="0" 
          font-family="Inter, system-ui, -apple-system, Roboto, sans-serif" 
          font-weight="800" 
          font-size="115" 
          fill="#FFFFFF" 
          letter-spacing="-1.5">Bridge</text>
    
    <!-- "Guardian" text in Electric Cyan/Blue -->
    <text x="365" y="0" 
          font-family="Inter, system-ui, -apple-system, Roboto, sans-serif" 
          font-weight="700" 
          font-size="115" 
          fill="url(#textGuardianGrad)" 
          letter-spacing="-1.5">Guardian</text>
          
    <!-- Subtitle AI Tag -->
    <text x="5" y="52" 
          font-family="Inter, system-ui, -apple-system, Roboto, sans-serif" 
          font-weight="600" 
          font-size="28" 
          fill="#64748B" 
          letter-spacing="6.5">EXPLAINABLE PREDICTIVE MAINTENANCE</text>
  </g>
</svg>
