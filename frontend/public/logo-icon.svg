<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded White Container Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8"/>
  
  <g transform="translate(40, 40) scale(0.844)">
    <!-- Inner Shield Gradient Background -->
    <defs>
      <linearGradient id="iconShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0A192F"/>
        <stop offset="100%" stop-color="#050C1A"/>
      </linearGradient>
      <linearGradient id="iconBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0070F3"/>
        <stop offset="100%" stop-color="#00D2FF"/>
      </linearGradient>
      <linearGradient id="iconGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#059669"/>
        <stop offset="50%" stop-color="#10B981"/>
        <stop offset="100%" stop-color="#34D399"/>
      </linearGradient>
      <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- Outer Shield Boundary -->
    <path d="M 256 44 
             C 380 44, 436 80, 436 180 
             C 436 320, 310 430, 256 468 
             C 202 430, 76 320, 76 180 
             C 76 80, 132 44, 256 44 Z" 
          fill="url(#iconShieldGrad)" 
          stroke="url(#iconBlueGrad)" 
          stroke-width="16" 
          stroke-linejoin="round"/>

    <!-- Inner Tech Circuit Network Lines -->
    <path d="M 120 180 H 392" stroke="#1E293B" stroke-width="6"/>
    <path d="M 160 120 V 280" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 6"/>
    <path d="M 352 120 V 280" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 6"/>

    <!-- Bridge Arch Truss (Upper Portion) -->
    <path d="M 110 180 Q 256 80 402 180" 
          fill="none" 
          stroke="url(#iconBlueGrad)" 
          stroke-width="14" 
          stroke-linecap="round"/>
          
    <path d="M 130 180 Q 256 104 382 180" 
          fill="none" 
          stroke="#00D2FF" 
          stroke-width="6" 
          stroke-opacity="0.8"/>

    <!-- Vertical Bridge Suspension Cables / Posts -->
    <line x1="160" y1="162" x2="160" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="200" y1="140" x2="200" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="256" y1="126" x2="256" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="312" y1="140" x2="312" y2="180" stroke="#00D2FF" stroke-width="6"/>
    <line x1="352" y1="162" x2="352" y2="180" stroke="#00D2FF" stroke-width="6"/>

    <!-- Lower Circuit Nodes (Bottom Tech Network) -->
    <path d="M 160 180 L 220 280 L 256 360 L 292 280 L 352 180" 
          fill="none" 
          stroke="url(#iconBlueGrad)" 
          stroke-width="6" 
          stroke-dasharray="12 8"/>

    <path d="M 256 180 V 420" 
          stroke="url(#iconBlueGrad)" 
          stroke-width="8"/>

    <!-- Circuit Nodes (Dots) -->
    <circle cx="160" cy="180" r="10" fill="#00D2FF"/>
    <circle cx="200" cy="180" r="8" fill="#0070F3"/>
    <circle cx="256" cy="180" r="12" fill="#00D2FF" filter="url(#iconGlow)"/>
    <circle cx="312" cy="180" r="8" fill="#0070F3"/>
    <circle cx="352" cy="180" r="10" fill="#00D2FF"/>

    <circle cx="220" cy="280" r="9" fill="#00D2FF"/>
    <circle cx="292" cy="280" r="9" fill="#00D2FF"/>
    <circle cx="256" cy="360" r="11" fill="#0070F3"/>
    <circle cx="256" cy="420" r="9" fill="#00D2FF"/>

    <circle cx="180" cy="230" r="7" fill="#0070F3"/>
    <circle cx="332" cy="230" r="7" fill="#0070F3"/>

    <!-- Green Structural Health Pulse Line (EKG/Vibration Line across center) -->
    <path d="M 90 240 
             L 170 240 
             L 190 210 
             L 210 270 
             L 235 175 
             L 265 295 
             L 285 225 
             L 305 250 
             L 320 240 
             L 422 240" 
          fill="none" 
          stroke="url(#iconGreenGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#iconGlow)"/>
  </g>
</svg>
