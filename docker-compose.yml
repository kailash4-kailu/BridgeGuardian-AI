version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bridgeguardian-db
    restart: always
    environment:
      POSTGRES_USER: bridge_user
      POSTGRES_PASSWORD: bridge_password_secure_123
      POSTGRES_DB: bridgeguardian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge_user -d bridgeguardian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bridgeguardian-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bridgeguardian-backend
    restart: always
    volumes:
      - static-data:/app/backend/static
      - model-data:/app/models
      - log-data:/app/logs
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://bridge_user:bridge_password_secure_123@db:5432/bridgeguardian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - GUNICORN_WORKERS=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bridgeguardian-celery-worker
    command: celery -A backend.core.celery_app.celery_app worker --loglevel=info
    restart: always
    volumes:
      - static-data:/app/backend/static
      - model-data:/app/models
      - log-data:/app/logs
    environment:
      - DATABASE_URL=postgresql://bridge_user:bridge_password_secure_123@db:5432/bridgeguardian
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bridgeguardian-frontend
    restart: always
    volumes:
      - static-data:/app/backend/static:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  static-data:
  model-data:
  log-data:
